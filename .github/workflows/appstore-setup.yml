name: App Store Connect setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    # Linux is enough for the App Store Connect API; no macOS minutes are used.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Register App IDs and report missing App Store Connect records
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "pyjwt[crypto]"
          python3 Scripts/appstore-register-bundle-ids.py
